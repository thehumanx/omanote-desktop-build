name: Secret scan

# This is a public repo. Content synced in from the private Omanote repo
# (see AGENTS.md "Desktop Build Sync Workflow") must never include secrets
# or session archives. This scans every push and fails the build if it does,
# so a leak like the 2026-07 archive/claude-sessions incident can't land
# silently again.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
